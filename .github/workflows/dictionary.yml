name: Dictionary

on:
  pull_request:
    paths:
      - "dictionary/**"
      - ".github/workflows/dictionary.yml"
  push:
    branches:
      - main
    paths:
      - "dictionary/**"
      - ".github/workflows/dictionary.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python dictionary/validate.py
